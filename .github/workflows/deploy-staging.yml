name: Deploy Staging

on:
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Verify staging FTP account
        run: |
          if [[ "${{ secrets.CPANEL_STAGING_FTP_USERNAME }}" != "stg@thunderpoint.com" ]]; then
            echo "CPANEL_STAGING_FTP_USERNAME does not match the expected staging FTP account."
            exit 1
          fi

      - name: Resolve staging paths
        run: |
          STAGING_PATH_INPUT="${{ secrets.CPANEL_STAGING_PATH }}"

          if [[ -z "$STAGING_PATH_INPUT" ]]; then
            echo "CPANEL_STAGING_PATH is not set."
            exit 1
          fi

          STAGING_PATH_INPUT="${STAGING_PATH_INPUT%/}"

          if [[ "$STAGING_PATH_INPUT" == */public_html/*/public ]]; then
            STAGING_APP_NAME="$(basename "$(dirname "$STAGING_PATH_INPUT")")"
          elif [[ "$STAGING_PATH_INPUT" == */public ]]; then
            STAGING_APP_NAME="$(basename "$(dirname "$STAGING_PATH_INPUT")")"
          else
            STAGING_APP_NAME="$(basename "$STAGING_PATH_INPUT")"
          fi

          if [[ -z "$STAGING_APP_NAME" || "$STAGING_APP_NAME" == "public" || "$STAGING_APP_NAME" == "." ]]; then
            echo "Unable to resolve a valid staging app directory from CPANEL_STAGING_PATH=$STAGING_PATH_INPUT"
            exit 1
          fi

          STAGING_APP_DIR="./$STAGING_APP_NAME/"
          STAGING_WEB_DIR="./public_html/$STAGING_APP_NAME/public/"

          echo "STAGING_APP_NAME=$STAGING_APP_NAME" >> "$GITHUB_ENV"
          echo "STAGING_APP_DIR=$STAGING_APP_DIR" >> "$GITHUB_ENV"
          echo "STAGING_WEB_DIR=$STAGING_WEB_DIR" >> "$GITHUB_ENV"
          echo "Resolved staging app dir: $STAGING_APP_DIR"
          echo "Resolved staging web dir: $STAGING_WEB_DIR"

      - name: Prepare staging app payload
        run: |
          mkdir deploy-app
          rsync -av ./ deploy-app/ \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='storage/framework/cache/data/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/views/' \
            --exclude='database/database.sqlite'

          # Optional: provide full staging .env via CPANEL_STAGING_ENV_B64 secret
          if [[ -n "${{ secrets.CPANEL_STAGING_ENV_B64 }}" ]]; then
            echo "${{ secrets.CPANEL_STAGING_ENV_B64 }}" | base64 --decode > deploy-app/.env
            chmod 600 deploy-app/.env
          fi

          printf 'workflow=deploy-staging\ncommit=%s\n' "$GITHUB_SHA" > deploy-app/staging-deploy-marker.txt

      - name: Prepare staging web payload
        run: |
          mkdir deploy-public
          rsync -av public/ deploy-public/

          printf 'staging-public-ok\ncommit=%s\n' "$GITHUB_SHA" > deploy-public/staging-public-check.txt

          perl -0pi -e "s#__DIR__\.'/\.\./storage/framework/maintenance\.php'#__DIR__.'/../../../${{ env.STAGING_APP_NAME }}/storage/framework/maintenance.php'#g; s#__DIR__\.'/\.\./vendor/autoload\.php'#__DIR__.'/../../../${{ env.STAGING_APP_NAME }}/vendor/autoload.php'#g; s#__DIR__\.'/\.\./bootstrap/app\.php'#__DIR__.'/../../../${{ env.STAGING_APP_NAME }}/bootstrap/app.php'#g" deploy-public/index.php

      - name: Upload app to cPanel staging via FTP (preserve server .env)
        if: ${{ secrets.CPANEL_STAGING_ENV_B64 == '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_STAGING_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_STAGING_FTP_PASSWORD }}
          protocol: ftp
          server-dir: ${{ env.STAGING_APP_DIR }}
          local-dir: ./deploy-app/
          log-level: verbose
          exclude: |
            **/.env
            **/.git*
            **/.github/**
            **/node_modules/**
            **/tests/**

      - name: Upload app to cPanel staging via FTP (including .env)
        if: ${{ secrets.CPANEL_STAGING_ENV_B64 != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_STAGING_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_STAGING_FTP_PASSWORD }}
          protocol: ftp
          server-dir: ${{ env.STAGING_APP_DIR }}
          local-dir: ./deploy-app/
          log-level: verbose
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/tests/**

      - name: Upload public files to cPanel staging web root via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_STAGING_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_STAGING_FTP_PASSWORD }}
          protocol: ftp
          server-dir: ${{ env.STAGING_WEB_DIR }}
          local-dir: ./deploy-public/
          log-level: verbose
          exclude: |
            **/.env
            **/.git*
            **/.github/**
            **/node_modules/**
            **/tests/**