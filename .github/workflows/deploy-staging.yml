name: Deploy Staging

on:
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Resolve staging paths
        run: |
          STAGING_WEB_ROOT="${{ secrets.CPANEL_STAGING_PATH }}"
          STAGING_WEB_ROOT="${STAGING_WEB_ROOT%/}"
          STAGING_APP_ROOT="$STAGING_WEB_ROOT"

          if [[ "$STAGING_WEB_ROOT" == */public ]]; then
            STAGING_APP_ROOT="${STAGING_WEB_ROOT%/public}"
          fi

          echo "STAGING_WEB_ROOT=$STAGING_WEB_ROOT" >> "$GITHUB_ENV"
          echo "STAGING_APP_ROOT=$STAGING_APP_ROOT" >> "$GITHUB_ENV"

      - name: Prepare staging app payload
        run: |
          mkdir deploy-app
          rsync -av ./ deploy-app/ \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='storage/framework/cache/data/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/views/' \
            --exclude='database/database.sqlite'

      - name: Upload app to cPanel staging via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_STAGING_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_STAGING_FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ env.STAGING_APP_ROOT }}/
          local-dir: ./deploy-app/
          exclude: |
            **/.env
            **/.git*
            **/.github/**
            **/node_modules/**
            **/tests/**