name: Deploy Staging

on:
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Verify staging FTP account
        run: |
          if [[ "${{ secrets.CPANEL_STAGING_FTP_USERNAME }}" != "stg@thunderpoint.com" ]]; then
            echo "CPANEL_STAGING_FTP_USERNAME does not match the expected staging FTP account."
            exit 1
          fi

      - name: Prepare staging app payload
        run: |
          mkdir deploy-app
          rsync -av ./ deploy-app/ \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='storage/framework/cache/data/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/views/' \
            --exclude='database/database.sqlite'

          printf 'workflow=deploy-staging\ncommit=%s\n' "$GITHUB_SHA" > deploy-app/staging-deploy-marker.txt

      - name: Upload app to cPanel staging via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_STAGING_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_STAGING_FTP_PASSWORD }}
          protocol: ftp
          server-dir: ./
          local-dir: ./deploy-app/
          log-level: verbose
          exclude: |
            **/.env
            **/.git*
            **/.github/**
            **/node_modules/**
            **/tests/**