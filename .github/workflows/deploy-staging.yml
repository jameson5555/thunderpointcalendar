name: Deploy Staging

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Resolve staging paths
        run: |
          STAGING_PATH_INPUT="${{ secrets.CPANEL_STAGING_PATH }}"

          if [[ -z "$STAGING_PATH_INPUT" ]]; then
            echo "CPANEL_STAGING_PATH is not set."
            exit 1
          fi

          STAGING_PATH_INPUT="${STAGING_PATH_INPUT%/}"

          if [[ "$STAGING_PATH_INPUT" == */public_html/*/public ]]; then
            STAGING_APP_NAME="$(basename "$(dirname "$STAGING_PATH_INPUT")")"
          elif [[ "$STAGING_PATH_INPUT" == */public ]]; then
            STAGING_APP_NAME="$(basename "$(dirname "$STAGING_PATH_INPUT")")"
          else
            STAGING_APP_NAME="$(basename "$STAGING_PATH_INPUT")"
          fi

          if [[ -z "$STAGING_APP_NAME" || "$STAGING_APP_NAME" == "public" || "$STAGING_APP_NAME" == "." ]]; then
            echo "Unable to resolve a valid staging app directory from CPANEL_STAGING_PATH=$STAGING_PATH_INPUT"
            exit 1
          fi

          STAGING_APP_DIR="./$STAGING_APP_NAME/"
          STAGING_WEB_DIR="./public_html/$STAGING_APP_NAME/public/"

          echo "STAGING_APP_NAME=$STAGING_APP_NAME" >> "$GITHUB_ENV"
          echo "STAGING_APP_DIR=$STAGING_APP_DIR" >> "$GITHUB_ENV"
          echo "STAGING_WEB_DIR=$STAGING_WEB_DIR" >> "$GITHUB_ENV"
          echo "Resolved staging app dir: $STAGING_APP_DIR"
          echo "Resolved staging web dir: $STAGING_WEB_DIR"

      - name: Prepare staging app payload
        run: |
          mkdir deploy-app
          rsync -av ./ deploy-app/ \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='storage/framework/cache/data/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/views/' \
            --exclude='database/database.sqlite'

          # Recreate writable framework directories in the release payload.
          mkdir -p \
            deploy-app/storage/framework/cache/data \
            deploy-app/storage/framework/sessions \
            deploy-app/storage/framework/views
          touch \
            deploy-app/storage/framework/cache/data/.gitignore \
            deploy-app/storage/framework/sessions/.gitignore \
            deploy-app/storage/framework/views/.gitignore

          # Optional: provide staging .env via CPANEL_STAGING_ENV_B64 secret
          if [[ -n "${{ secrets.CPANEL_STAGING_ENV_B64 }}" ]]; then
            printf '%s' "${{ secrets.CPANEL_STAGING_ENV_B64 }}" | base64 --decode > deploy-app/.env
            chmod 600 deploy-app/.env
          fi

      - name: Prepare staging web payload
        run: |
          mkdir deploy-public
          rsync -av public/ deploy-public/

          perl -0pi -e "s#__DIR__\.'/\.\./storage/framework/maintenance\.php'#__DIR__.'/../../../${{ env.STAGING_APP_NAME }}/storage/framework/maintenance.php'#g; s#__DIR__\.'/\.\./vendor/autoload\.php'#__DIR__.'/../../../${{ env.STAGING_APP_NAME }}/vendor/autoload.php'#g; s#__DIR__\.'/\.\./bootstrap/app\.php'#__DIR__.'/../../../${{ env.STAGING_APP_NAME }}/bootstrap/app.php'#g" deploy-public/index.php

      - name: Package staging payloads
        run: |
          tar -C deploy-app -czf staging-app.tar.gz .
          tar -C deploy-public -czf staging-public.tar.gz .

      - name: Configure staging SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.CPANEL_SSH_USERNAME }}
        run: |
          if [[ -z "$SSH_PRIVATE_KEY" || -z "$SSH_HOST" || -z "$SSH_USERNAME" ]]; then
            echo "CPANEL_SSH_PRIVATE_KEY, CPANEL_SSH_HOST, and CPANEL_SSH_USERNAME must be set."
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload compressed staging payloads
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.CPANEL_SSH_USERNAME }}
        run: |
          scp -P 22 staging-app.tar.gz staging-public.tar.gz \
            "$SSH_USERNAME@$SSH_HOST:/home/$SSH_USERNAME/"

      - name: Install staging release
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.CPANEL_SSH_USERNAME }}
        run: |
          ssh -p 22 "$SSH_USERNAME@$SSH_HOST" \
            "DEPLOY_APP_NAME='$STAGING_APP_NAME' bash -se" <<'REMOTE'
          set -euo pipefail

          APP_DIR="/home/$USER/$DEPLOY_APP_NAME"
          WEB_DIR="/home/$USER/public_html/$DEPLOY_APP_NAME/public"
          PHP_BIN="/opt/cpanel/ea-php84/root/usr/bin/php"

          mkdir -p "$APP_DIR" "$WEB_DIR"
          tar -xzf "/home/$USER/staging-app.tar.gz" -C "$APP_DIR"
          chmod -R ug+rwX "$APP_DIR/storage" "$APP_DIR/bootstrap/cache"

          cd "$APP_DIR"
          "$PHP_BIN" artisan migrate --seed --force
          "$PHP_BIN" artisan optimize

          tar -xzf "/home/$USER/staging-public.tar.gz" -C "$WEB_DIR"
          rm -f "/home/$USER/staging-app.tar.gz" "/home/$USER/staging-public.tar.gz"
          REMOTE
