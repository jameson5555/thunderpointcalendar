name: Deploy Production

on:
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Resolve production paths
        run: |
          PRODUCTION_PATH_INPUT="${{ secrets.CPANEL_PRODUCTION_PATH }}"

          if [[ -z "$PRODUCTION_PATH_INPUT" ]]; then
            echo "CPANEL_PRODUCTION_PATH is not set."
            exit 1
          fi

          PRODUCTION_PATH_INPUT="${PRODUCTION_PATH_INPUT%/}"

          if [[ "$PRODUCTION_PATH_INPUT" == */public ]]; then
            PRODUCTION_APP_NAME="$(basename "$(dirname "$PRODUCTION_PATH_INPUT")")"
          else
            PRODUCTION_APP_NAME="$(basename "$PRODUCTION_PATH_INPUT")"
          fi

          if [[ -z "$PRODUCTION_APP_NAME" || "$PRODUCTION_APP_NAME" == "public" || "$PRODUCTION_APP_NAME" == "." ]]; then
            echo "Unable to resolve a valid production app directory from CPANEL_PRODUCTION_PATH=$PRODUCTION_PATH_INPUT"
            exit 1
          fi

          PRODUCTION_APP_DIR="./$PRODUCTION_APP_NAME/"
          PRODUCTION_WEB_DIR="./public_html/"

          echo "PRODUCTION_APP_DIR=$PRODUCTION_APP_DIR" >> "$GITHUB_ENV"
          echo "PRODUCTION_WEB_DIR=$PRODUCTION_WEB_DIR" >> "$GITHUB_ENV"
          echo "PRODUCTION_APP_NAME=$PRODUCTION_APP_NAME" >> "$GITHUB_ENV"
          echo "Resolved production app dir: $PRODUCTION_APP_DIR"
          echo "Resolved production web dir: $PRODUCTION_WEB_DIR"

      - name: Prepare production app payload
        run: |
          mkdir deploy-app
          rsync -av ./ deploy-app/ \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='storage/framework/cache/data/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/views/' \
            --exclude='database/database.sqlite'

          # Recreate writable framework directories so FTP deploy uploads them.
          mkdir -p \
            deploy-app/storage/framework/cache/data \
            deploy-app/storage/framework/sessions \
            deploy-app/storage/framework/views
          touch \
            deploy-app/storage/framework/cache/data/.gitignore \
            deploy-app/storage/framework/sessions/.gitignore \
            deploy-app/storage/framework/views/.gitignore

          # Optional: provide production .env via CPANEL_PRODUCTION_ENV_B64 secret
          if [[ -n "${{ secrets.CPANEL_PRODUCTION_ENV_B64 }}" ]]; then
            mkdir deploy-env
            echo "${{ secrets.CPANEL_PRODUCTION_ENV_B64 }}" | base64 --decode > deploy-env/.env
            chmod 600 deploy-env/.env
            echo "HAS_PRODUCTION_ENV=true" >> "$GITHUB_ENV"
          fi

      - name: Prepare production web payload
        run: |
          mkdir deploy-public
          rsync -av public/ deploy-public/

          perl -0pi -e "s#__DIR__\.'/\.\./storage/framework/maintenance\.php'#__DIR__.'/../${{ env.PRODUCTION_APP_NAME }}/storage/framework/maintenance.php'#g; s#__DIR__\.'/\.\./vendor/autoload\.php'#__DIR__.'/../${{ env.PRODUCTION_APP_NAME }}/vendor/autoload.php'#g; s#__DIR__\.'/\.\./bootstrap/app\.php'#__DIR__.'/../${{ env.PRODUCTION_APP_NAME }}/bootstrap/app.php'#g" deploy-public/index.php

      - name: Upload app to cPanel production via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_PRODUCTION_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_PRODUCTION_FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ env.PRODUCTION_APP_DIR }}
          local-dir: ./deploy-app/
          exclude: |
            **/.env
            **/.git*
            **/.github/**
            **/node_modules/**
            **/tests/**

      - name: Upload .env to cPanel production via FTP
        if: env.HAS_PRODUCTION_ENV == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_PRODUCTION_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_PRODUCTION_FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ env.PRODUCTION_APP_DIR }}
          local-dir: ./deploy-env/

      - name: Upload public files to cPanel production web root via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_PRODUCTION_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_PRODUCTION_FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ env.PRODUCTION_WEB_DIR }}
          local-dir: ./deploy-public/
          exclude: |
            **/.env
            **/.git*
            **/.github/**
            **/node_modules/**
            **/tests/**