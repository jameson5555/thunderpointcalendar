name: Deploy Production

on:
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Resolve production paths
        run: |
          PRODUCTION_PATH_INPUT="${{ secrets.CPANEL_PRODUCTION_PATH }}"

          if [[ -z "$PRODUCTION_PATH_INPUT" ]]; then
            echo "CPANEL_PRODUCTION_PATH is not set."
            exit 1
          fi

          PRODUCTION_PATH_INPUT="${PRODUCTION_PATH_INPUT%/}"

          if [[ "$PRODUCTION_PATH_INPUT" == */public ]]; then
            PRODUCTION_APP_NAME="$(basename "$(dirname "$PRODUCTION_PATH_INPUT")")"
          else
            PRODUCTION_APP_NAME="$(basename "$PRODUCTION_PATH_INPUT")"
          fi

          if [[ -z "$PRODUCTION_APP_NAME" || "$PRODUCTION_APP_NAME" == "public" || "$PRODUCTION_APP_NAME" == "." ]]; then
            echo "Unable to resolve a valid production app directory from CPANEL_PRODUCTION_PATH=$PRODUCTION_PATH_INPUT"
            exit 1
          fi

          PRODUCTION_APP_DIR="./$PRODUCTION_APP_NAME/"
          PRODUCTION_WEB_DIR="./public_html/"

          echo "PRODUCTION_APP_DIR=$PRODUCTION_APP_DIR" >> "$GITHUB_ENV"
          echo "PRODUCTION_WEB_DIR=$PRODUCTION_WEB_DIR" >> "$GITHUB_ENV"
          echo "PRODUCTION_APP_NAME=$PRODUCTION_APP_NAME" >> "$GITHUB_ENV"
          echo "Resolved production app dir: $PRODUCTION_APP_DIR"
          echo "Resolved production web dir: $PRODUCTION_WEB_DIR"

      - name: Prepare production app payload
        run: |
          mkdir deploy-app
          rsync -av ./ deploy-app/ \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='storage/framework/cache/data/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/views/' \
            --exclude='database/database.sqlite'

          # Recreate writable framework directories in the release payload.
          mkdir -p \
            deploy-app/storage/framework/cache/data \
            deploy-app/storage/framework/sessions \
            deploy-app/storage/framework/views
          touch \
            deploy-app/storage/framework/cache/data/.gitignore \
            deploy-app/storage/framework/sessions/.gitignore \
            deploy-app/storage/framework/views/.gitignore

          if [[ -z "${{ secrets.CPANEL_PRODUCTION_ENV_B64 }}" ]]; then
            echo "CPANEL_PRODUCTION_ENV_B64 is not set."
            exit 1
          fi

          printf '%s' "${{ secrets.CPANEL_PRODUCTION_ENV_B64 }}" | base64 --decode > deploy-app/.env
          chmod 600 deploy-app/.env

      - name: Prepare production web payload
        run: |
          mkdir deploy-public
          rsync -av public/ deploy-public/

          perl -0pi -e "s#__DIR__\.'/\.\./storage/framework/maintenance\.php'#__DIR__.'/../${{ env.PRODUCTION_APP_NAME }}/storage/framework/maintenance.php'#g; s#__DIR__\.'/\.\./vendor/autoload\.php'#__DIR__.'/../${{ env.PRODUCTION_APP_NAME }}/vendor/autoload.php'#g; s#__DIR__\.'/\.\./bootstrap/app\.php'#__DIR__.'/../${{ env.PRODUCTION_APP_NAME }}/bootstrap/app.php'#g" deploy-public/index.php

      - name: Package production payloads
        run: |
          tar -C deploy-app -czf production-app.tar.gz .
          tar -C deploy-public -czf production-public.tar.gz .

      - name: Configure production SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
        run: |
          if [[ -z "$SSH_PRIVATE_KEY" || -z "$SSH_HOST" ]]; then
            echo "Production SSH secrets are not set."
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload compressed production payloads
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.CPANEL_SSH_USERNAME }}
        run: |
          scp -P 22 production-app.tar.gz production-public.tar.gz \
            "$SSH_USERNAME@$SSH_HOST:/home/$SSH_USERNAME/"

      - name: Install production release
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.CPANEL_SSH_USERNAME }}
        run: |
          ssh -p 22 "$SSH_USERNAME@$SSH_HOST" \
            "DEPLOY_APP_NAME='$PRODUCTION_APP_NAME' bash -se" <<'REMOTE'
          set -euo pipefail

          APP_DIR="/home/$USER/$DEPLOY_APP_NAME"
          WEB_DIR="/home/$USER/public_html"
          PHP_BIN="/opt/cpanel/ea-php84/root/usr/bin/php"

          mkdir -p "$APP_DIR" "$WEB_DIR"
          tar -xzf "/home/$USER/production-app.tar.gz" -C "$APP_DIR"
          chmod -R ug+rwX "$APP_DIR/storage" "$APP_DIR/bootstrap/cache"

          cd "$APP_DIR"
          "$PHP_BIN" artisan migrate --seed --force
          "$PHP_BIN" artisan optimize

          tar -xzf "/home/$USER/production-public.tar.gz" -C "$WEB_DIR"
          rm -f "/home/$USER/production-app.tar.gz" "/home/$USER/production-public.tar.gz"
          REMOTE
