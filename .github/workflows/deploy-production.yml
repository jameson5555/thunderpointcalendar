name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Resolve production paths
        run: |
          PRODUCTION_APP_ROOT="${{ secrets.CPANEL_PRODUCTION_PATH }}"
          PRODUCTION_APP_ROOT="${PRODUCTION_APP_ROOT%/}"
          CPANEL_HOME="$(dirname "$PRODUCTION_APP_ROOT")"
          PRODUCTION_WEB_ROOT="$CPANEL_HOME/public_html"
          PRODUCTION_APP_NAME="$(basename "$PRODUCTION_APP_ROOT")"

          echo "PRODUCTION_APP_ROOT=$PRODUCTION_APP_ROOT" >> "$GITHUB_ENV"
          echo "PRODUCTION_WEB_ROOT=$PRODUCTION_WEB_ROOT" >> "$GITHUB_ENV"
          echo "PRODUCTION_APP_NAME=$PRODUCTION_APP_NAME" >> "$GITHUB_ENV"

      - name: Prepare production app payload
        run: |
          mkdir deploy-app
          rsync -av ./ deploy-app/ \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='storage/framework/cache/data/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/views/' \
            --exclude='database/database.sqlite'

      - name: Prepare production web payload
        run: |
          mkdir deploy-public
          rsync -av public/ deploy-public/

          perl -0pi -e "s#__DIR__\.'/\.\./storage/framework/maintenance\.php'#__DIR__.'/../${{ env.PRODUCTION_APP_NAME }}/storage/framework/maintenance.php'#g; s#__DIR__\.'/\.\./vendor/autoload\.php'#__DIR__.'/../${{ env.PRODUCTION_APP_NAME }}/vendor/autoload.php'#g; s#__DIR__\.'/\.\./bootstrap/app\.php'#__DIR__.'/../${{ env.PRODUCTION_APP_NAME }}/bootstrap/app.php'#g" deploy-public/index.php

      - name: Upload app to cPanel production via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ env.PRODUCTION_APP_ROOT }}/
          local-dir: ./deploy-app/
          exclude: |
            **/.env
            **/.git*
            **/.github/**
            **/node_modules/**
            **/tests/**

      - name: Upload public files to cPanel production web root via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ env.PRODUCTION_WEB_ROOT }}/
          local-dir: ./deploy-public/
          exclude: |
            **/.env
            **/.git*
            **/.github/**
            **/node_modules/**
            **/tests/**